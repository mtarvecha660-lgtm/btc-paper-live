name: paper-tick

# Runs the PAPER trading bot (virtual money only) every 15 minutes, commits the
# accounts' state back to this repo, and publishes the dashboard to GitHub Pages.
# Stop it any time: Actions tab -> paper-tick -> "..." -> Disable workflow.

on:
  schedule:
    - cron: "*/15 * * * *"     # GitHub may start scheduled runs late; the bot catches up on missed candles
  workflow_dispatch: {}

permissions:
  contents: write     # commit the paper accounts' state
  pages: write        # publish the dashboard
  id-token: write

concurrency:
  group: paper-tick   # never two ticks at once; a new one waits for the running one
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install
        run: pip install -q -r requirements-live.txt

      - name: Paper tick (virtual money)
        run: python live/tick.py

      - name: Commit paper state
        run: |
          git config user.name  "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "paper tick $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push failed, retrying ($i)"; sleep $((i * 5))
          done
          exit 1

      - name: Build dashboard
        if: always()
        run: python live/build_site.py

      - uses: actions/configure-pages@v6
        if: always()

      - uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: _site

      - id: deploy
        if: always()
        uses: actions/deploy-pages@v5
