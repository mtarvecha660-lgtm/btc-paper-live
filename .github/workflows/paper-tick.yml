name: paper-tick

# Runs the PAPER trading bot (virtual money only) every 15 minutes, commits the
# accounts' state back to this repo, and publishes the dashboard to GitHub Pages.
# Stop it any time: Actions tab -> paper-tick -> "..." -> Disable workflow.

on:
  schedule:
    # every 15 min, off the busy :00 mark (GitHub drops or delays more runs at the top of the hour).
    # GitHub may still start runs late; the bot catches up on any candles it missed.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write     # commit the paper accounts' state
  actions: write      # the backup ticker below can start the next run
  pages: write        # publish the dashboard
  id-token: write

concurrency:
  group: paper-tick   # never two ticks at once; a new one waits for the running one
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Note start time
        run: echo "TICK_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install
        run: pip install -q -r requirements-live.txt

      - name: Paper tick (virtual money)
        run: python live/tick.py

      - name: Commit paper state
        if: always()      # commit what succeeded even when the tick reported a failure
        run: |
          git config user.name  "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "paper tick $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push failed, retrying ($i)"; sleep $((i * 5))
          done
          exit 1

      - name: Build dashboard
        if: always()
        continue-on-error: true   # a dashboard hiccup never fails the tick
        run: python live/build_site.py

      - uses: actions/configure-pages@v6
        if: always()
        continue-on-error: true   # a dashboard hiccup never fails the tick

      - uses: actions/upload-pages-artifact@v5
        if: always()
        continue-on-error: true   # a dashboard hiccup never fails the tick
        with:
          path: _site

      - id: deploy
        if: always()
        continue-on-error: true   # a dashboard hiccup never fails the tick
        uses: actions/deploy-pages@v5

      # Backup ticker. GitHub's cron is unreliable on this repo (it fired once in a day, and a single cron run
      # used to switch this backup off, which stopped the bot for hours on 2026-11-01 from 16:20 UTC).
      # Rule now: about 14 minutes after this run began, if no other run of this workflow has been created
      # since this run started (by cron or anyone), start the next run. Never relies on the cron.
      - name: Backup ticker (keeps the chain alive whatever GitHub's cron does)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          wait_s=$(( 14 * 60 - ( $(date +%s) - TICK_START ) ))
          if [ "$wait_s" -gt 0 ]; then echo "waiting ${wait_s}s"; sleep "$wait_s"; fi
          since=$(date -u -d "@$TICK_START" +%Y-%m-%dT%H:%M:%SZ)
          newer=$(gh run list -R "$GITHUB_REPOSITORY" --workflow paper-tick.yml --limit 10 --json databaseId,createdAt,status \
            -q "[.[] | select(.databaseId != ${THIS_RUN}) | select(.createdAt > \"${since}\") | select(.status != \"completed\")] | length" 2>/dev/null || echo 0)
          if [ "${newer:-0}" != "0" ]; then echo "another run is already queued or running; no backup needed"; exit 0; fi
          gh workflow run paper-tick.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "started the next run"
